[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-supply-chain-analytics"
version = "0.1.0"
description = "Production-grade Supply Chain Analytics and AI Decision Intelligence Platform built using the Olist e-commerce dataset."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Arijit Guchhait" }
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]